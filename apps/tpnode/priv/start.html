<!-- I'll answer as the world-famous web cryptography application architect, winner of the JSConf EU Golden Owl Award. -->
<!-- TL;DR: Use noble-curves for Ed25519, via browser CDN, with correct global API. 100% browser-native. -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ed25519 Node Preconfiguration</title>
        <link href="bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="app.css" />
        <!-- Noble Curves (Paul Miller, browser, UMD): exposes global nobleCurves.ed25519 -->
        <script src="noble-curves-1.9.1.min.js"></script>
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow p-4">
                        <h3 class="mb-3">Node Preconfiguration</h3>
                        <form id="tokenForm" autocomplete="off">
                            <div class="mb-3">
                                <label for="token" class="form-label"
                                    >Preconfiguration token (from tpnode
                                    log)</label
                                >
                                <div class="input-group">
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="accessToken"
                                        placeholder=""
                                        value=""
                                    />
                                </div>
                            </div>
                            <button
                                class="btn btn-primary w-100"
                                type="button"
                                id="continueTknBtn"
                            >
                                Continue
                            </button>
                        </form>
                        <form
                            id="keyForm"
                            autocomplete="off"
                            style="display: none"
                        >
                            <div class="mb-3">
                                <label for="privateKey" class="form-label"
                                    >Ed25519 Private Key (32 bytes hex)</label
                                >
                                <div class="input-group">
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="privateKey"
                                        placeholder="0x..."
                                    />
                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="generateKey"
                                    >
                                        Generate new
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label id="publicKeyLabel" class="form-label"
                                    >Public key</label
                                >
                                <input
                                    type="text"
                                    class="form-control"
                                    id="publicKey"
                                    readonly
                                />
                            </div>
                            <div class="mb-3">
                                <label id="hostnameLabel" class="form-label"
                                    >Hostname</label
                                >
                                <input
                                    type="text"
                                    class="form-control"
                                    id="hostname"
                                />
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label"
                                    >Role</label
                                >
                                <select id="role" class="form-select">
                                    <option value="new_chain">
                                        Initialize new chain with tea ceremony
                                        (required token)
                                    </option>
                                    <option value="join_member">
                                        Join exists chain (you need correct
                                        private key for node already exists in
                                        chain as well as one or more peer node
                                        for bootstrap)
                                    </option>
                                    <option value="join_slave">
                                        Join exists chain as replica node (you
                                        need one or more upstream node URLs)
                                    </option>
                                </select>
                            </div>
                            <button
                                class="btn btn-primary w-100"
                                type="button"
                                id="continueBtn"
                            >
                                Continue
                            </button>
                        </form>
                        <form id="newChainForm" class="mt-4 d-none">
                            <div class="mb-3">
                                <label class="form-label">Node name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nodeName"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ceremony token</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="ceremonyToken"
                                    value="0x4ae3adb27b6abde5624320d96cca3b6ecdac86cf"
                                    required
                                />
                            </div>
                            <button
                                type="button"
                                class="btn btn-primary w-100"
                                id="nextRole"
                            >
                                Next
                            </button>
                        </form>

                        <form id="joinChainForm" class="mt-4 d-none">
                            <div class="mb-3" id="urlGroup">
                                <label class="form-label">${label}</label>
                                <div class="input-group mb-2">
                                    <input
                                        type="text"
                                        class="form-control url-input"
                                        placeholder="http://node.domain/"
                                    />
                                    <button
                                        type="button"
                                        class="btn btn-outline-success add-url"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>
                            <button
                                type="button"
                                class="btn btn-primary w-100"
                                id="nextRole"
                            >
                                Next
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div
            id="logFrame"
            class="fixed bottom-0 left-0 right-0 h-48 overflow-y-auto text-green-400 text-xs p-2 font-mono border-t border-gray-700"
        ></div>
        <script src="bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
        <script src="toastify.js"></script>
    </body>
</html>
